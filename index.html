<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fogbound — Custom World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#707873;color:#eee;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;left:24px;top:20px;font-size:11px;letter-spacing:4px;opacity:.55}
#status{position:absolute;right:24px;top:20px;font-size:10px;letter-spacing:1.5px;opacity:.5}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:11px;letter-spacing:1.3px;opacity:.48;white-space:nowrap}
#prompt{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:10px 15px;border:1px solid #ffffff2b;background:#080a0acc;font-size:11px;letter-spacing:2px;opacity:0}
#joystick{position:fixed;left:25px;bottom:27px;width:128px;height:128px;border:1px solid #ffffff1c;border-radius:50%;background:#1519183d;pointer-events:auto}
#stick{position:absolute;left:37px;top:37px;width:54px;height:54px;border-radius:50%;background:#dfe4e222;border:1px solid #ffffff20}
#light{position:fixed;right:27px;bottom:28px;width:110px;height:43px;background:#16191866;color:#ddd;border:1px solid #ffffff24;font-size:10px;letter-spacing:1.5px;pointer-events:auto}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080a0bea;pointer-events:auto}
.card{width:min(610px,calc(100vw - 36px));box-sizing:border-box;padding:42px 28px 38px;text-align:center;border:1px solid #ffffff22;background:#0a0c0ce8}
.card h1{font-size:40px;font-weight:400;letter-spacing:9px;margin:0 0 12px}
.card p{color:#aeb5b1;line-height:1.65}
.card button{margin-top:18px;padding:16px 30px;border:0;background:#d9ddda;color:#151717;letter-spacing:3px}
@media(min-width:800px){#joystick,#light{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div id="title">FOGBOUND // CUSTOM WORLD</div>
<div id="status">FLASHLIGHT 100%</div>
<div id="prompt"></div>
<div id="hint">WASD / ARROWS TO WALK · DRAG ANYWHERE TO LOOK</div>
<div id="joystick"><div id="stick"></div></div>
<button id="light">FLASHLIGHT</button>
</div>
<div id="start"><div class="card"><h1>FOGBOUND</h1>
<p>Your world has been loaded.</p><p>Walk into the fog. Drag the mouse or your finger anywhere outside the joystick to look around.</p>
<button id="play">ENTER THE FOG</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
if(!window.THREE){document.querySelector('.card p').textContent='Three.js could not load. Disable Brave Shields for this site and reload.';return;}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x707873);
scene.fog=new THREE.Fog(0x707873,5.5,31);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8e0dc,0x242a27,1.55));
const sun=new THREE.DirectionalLight(0xe5e1cf,1.7);
sun.position.set(-25,45,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const world=new THREE.Group();scene.add(world);
let worldReady=false, worldMeshes=[], solidMeshes=[];

const loader=new THREE.GLTFLoader();
loader.load('level.glb',gltf=>{
  world.add(gltf.scene);
  gltf.scene.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;o.receiveShadow=true;
      worldMeshes.push(o);
      // Names in the supplied file include house, tree, fense, ground, water, window.
      const n=(o.name||'').toLowerCase();
      if(!/ground|water|window/.test(n)) solidMeshes.push(o);
    }
  });
  // Put the supplied world into a sensible game scale if its authored scale is tiny.
  const box=new THREE.Box3().setFromObject(gltf.scene);
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  if(maxDim<5) gltf.scene.scale.setScalar(4);
  worldReady=true;
},undefined,err=>{
  console.error(err);
  document.querySelector('.card p:first-of-type').textContent='Could not load level.glb.';
});

const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.95,6,10),new THREE.MeshStandardMaterial({color:0x252a29,roughness:1}));
body.position.y=.95;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.30,12,8),new THREE.MeshStandardMaterial({color:0x887d70,roughness:1}));
head.position.y=1.75;head.castShadow=true;player.add(head);

const flash=new THREE.SpotLight(0xfff4d2,10,25,Math.PI/8,.62,1.2);
flash.position.set(0,1.45,.1);flash.target.position.set(0,1.2,-7);player.add(flash,flash.target);
const glow=new THREE.PointLight(0xffe6b0,.55,3.5);glow.position.set(0,1.35,.2);player.add(glow);

let yaw=Math.PI,pitch=.28,lightOn=true;
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='f')toggleLight();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggleLight(){lightOn=!lightOn;flash.visible=lightOn;glow.visible=lightOn;document.getElementById('status').textContent=lightOn?'FLASHLIGHT 100%':'FLASHLIGHT OFF'}
document.getElementById('light').onclick=toggleLight;

// Desktop and mobile camera: drag anywhere except the movement joystick.
let lookPointer=null,lx=0,ly=0;
function lookDown(e){
 if(e.target.closest && e.target.closest('#joystick'))return;
 lookPointer=e.pointerId;lx=e.clientX;ly=e.clientY;
 try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}
}
function lookMove(e){
 if(e.pointerId!==lookPointer)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
 yaw-=dx*.0065;
 pitch=THREE.MathUtils.clamp(pitch+dy*.0045,-.22,.72);
}
function lookUp(e){if(e.pointerId===lookPointer)lookPointer=null}
renderer.domElement.addEventListener('pointerdown',lookDown);
renderer.domElement.addEventListener('pointermove',lookMove);
renderer.domElement.addEventListener('pointerup',lookUp);
renderer.domElement.addEventListener('pointercancel',lookUp);

// Mobile joystick.
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');
let jx=0,jy=0,jactive=false,jid=null;
function joyMove(e){
 const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),max=48;
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 jx=dx/max;jy=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{jactive=true;jid=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(jactive&&e.pointerId===jid)joyMove(e)});
joyEl.addEventListener('pointerup',()=>{jactive=false;jx=jy=0;stick.style.transform='translate(0,0)'});

// Collision against supplied world geometry using short raycasts.
// Four horizontal probes make walls/objects solid while still allowing smooth sliding.
const ray=new THREE.Raycaster();
const downRay=new THREE.Raycaster();
const tmp=new THREE.Vector3(), dir=new THREE.Vector3();
function canMoveTo(x,z){
 if(!worldReady)return true;
 const originY=player.position.y+1.0;
 const probes=[
  [1,0],[.707,.707],[-.707,.707],[-1,0],[-.707,-.707],[.707,-.707]
 ];
 for(const p of probes){
   tmp.set(x,originY,z);
   dir.set(p[0],0,p[1]).normalize();
   ray.set(tmp,dir);
   const hits=ray.intersectObjects(solidMeshes,true);
   for(const h of hits) if(h.distance<.55)return false;
 }
 return true;
}
function groundHeight(x,z){
 if(!worldReady)return 0;
 downRay.set(new THREE.Vector3(x,30,z),new THREE.Vector3(0,-1,0));
 const hits=downRay.intersectObjects(worldMeshes,true);
 if(hits.length)return hits[0].point.y;
 return 0;
}

function move(dt){
 let x=0,z=0;
 if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;
 if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;
 x+=jx;z+=jy;
 const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}
 if(l>.08){
   const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
   const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   const d=f.multiplyScalar(-z).add(r.multiplyScalar(x)).normalize();
   const sp=3.6;
   const nx=player.position.x+d.x*sp*dt,nz=player.position.z+d.z*sp*dt;
   if(canMoveTo(nx,nz)){player.position.x=nx;player.position.z=nz}
   else{
     if(canMoveTo(nx,player.position.z))player.position.x=nx;
     if(canMoveTo(player.position.x,nz))player.position.z=nz;
   }
   player.rotation.y=Math.atan2(d.x,d.z);
 }
 const gy=groundHeight(player.position.x,player.position.z);
 player.position.y=THREE.MathUtils.lerp(player.position.y,gy,.25);
}

function updateCamera(dt){
 const target=new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z);
 const dist=5.2;
 const desired=new THREE.Vector3(
   player.position.x+Math.sin(yaw)*dist*Math.cos(pitch),
   player.position.y+2.15+Math.sin(pitch)*2.0,
   player.position.z+Math.cos(yaw)*dist*Math.cos(pitch)
 );
 camera.position.lerp(desired,1-Math.pow(.0005,dt));
 camera.lookAt(target);
}

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.033);
 move(dt);updateCamera(dt);
 flash.intensity=lightOn?(10+Math.sin(performance.now()*.017)*.13):0;
 renderer.render(scene,camera);
}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';loop()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
<script>
// Minimal GLTFLoader kept in a second script tag so the game stays one-file simple.
</script>
</body>
</html>
